version: "3"

tasks:
    dev:
        desc: Start the Astro web development server.
        cmds:
            - bun run dev

    build:
        desc: Build the Astro static site and React web app.
        cmds:
            - bun run build

    preview:
        desc: Preview the production web build.
        cmds:
            - bun run preview

    check:
        desc: Type-check Astro pages and components.
        cmds:
            - bun run check

    test:
        desc: Run web behavior tests.
        cmds:
            - bun run test
