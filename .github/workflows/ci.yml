name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup JS
        uses: ./.github/actions/setup-js
        with:
          save-cache: ${{ github.ref == 'refs/heads/main' && 'true' || 'false' }}

      - name: Run frontend checks
        run: task check

      - name: Run behavior and updater release tests
        run: task test

  installer-languages:
    name: Windows installer regressions
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup JS
        uses: ./.github/actions/setup-js
      - name: Setup NSIS 3.11
        shell: pwsh
        run: |
          $nsisArchive = Join-Path $env:RUNNER_TEMP "nsis-3.11.zip"
          $nsisDirectory = Join-Path $env:RUNNER_TEMP "nsis-3.11"
          Invoke-WebRequest -Uri "https://github.com/tauri-apps/binary-releases/releases/download/nsis-3.11/nsis-3.11.zip" -OutFile $nsisArchive
          Expand-Archive -LiteralPath $nsisArchive -DestinationPath $nsisDirectory
          $compiler = Get-ChildItem -LiteralPath $nsisDirectory -Recurse -Filter makensis.exe | Sort-Object { $_.FullName.Length } | Select-Object -First 1
          if (-not $compiler) { throw "NSIS compiler is missing" }
          "NSIS_DIR=$($compiler.DirectoryName)" >> $env:GITHUB_ENV
      - name: Verify installer languages and legacy upgrade paths
        run: bun test scripts/nsis-language.test.mjs scripts/nsis-upgrade.test.mjs

  rust:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup JS
        uses: ./.github/actions/setup-js

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./packages/desktop/src-tauri -> target"
          shared-key: tauri-linux
          cache-on-failure: true

      - name: Generate icons
        run: task desktop:generate:icons

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            build-essential \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Run Rust checks
        run: |
          task desktop:rust:format:check
          task desktop:rust:clippy
