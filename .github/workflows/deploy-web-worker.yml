name: Deploy Web Worker

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: deploy-web-worker-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Worker
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup JS
        uses: ./.github/actions/setup-js
        with:
          save-cache: ${{ github.ref == 'refs/heads/main' && 'true' || 'false' }}

      - name: Build and deploy to Cloudflare Workers
        run: task deploy:web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
